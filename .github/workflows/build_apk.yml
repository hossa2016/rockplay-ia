name: Build APK RockPlay IA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - run: flutter create --platforms=android --project-name rockplay --org com.rockplayia .
      - run: python3 tools/setup_android.py
      - run: python3 tools/add_deps.py
      - run: python3 tools/setup_android.py
      - run: |
          pip install pillow
          python3 tools/make_icon.py
          flutter pub add --dev flutter_launcher_icons
          dart run flutter_launcher_icons
      - run: flutter pub get
      - name: Parchear flutter_inappwebview
        run: |
          for f in $(find ~/.pub-cache -path '*flutter_inappwebview_android*/android/build.gradle'); do
            sed -i "s/proguard-android\.txt/proguard-android-optimize.txt/g" "$f"
          done
          pip install pillow
          python tools/setup_icon.py
      - name: Firma fija (permite actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android
          cp tools/debug.keystore ~/.android/debug.keystore
      - name: Evitar atasco de Gradle (vigilante de archivos)
        run: |
          echo "org.gradle.vfs.watch=false" >> android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError" >> android/gradle.properties
          echo "kotlin.daemon.jvmargs=-Xmx2g" >> android/gradle.properties
          free -m
      - run: python3 tools/fix_signing.py
      - run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}
      - name: Publicar APK en Releases (no gasta el espacio de Actions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk RockPlayIA.apk
          gh release delete ultima --yes --cleanup-tag || true
          VER=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          gh release create ultima RockPlayIA.apk --target "${{ github.sha }}" --prerelease \
            --title "RockPlay IA v$VER (compilación ${{ github.run_number }})" \
            --notes "Compilado automáticamente del commit ${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: RockPlayIA-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 3
