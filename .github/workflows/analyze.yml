name: Analizar
on:
  push:
    branches: ['wip/**']
  workflow_dispatch:
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - run: flutter create --platforms=android --project-name rockplay --org com.rockplayia .
      - run: python3 tools/add_deps.py
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib 2>&1 | grep -E "error •|^[0-9]+ issues|No issues" | head -150
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings lib
